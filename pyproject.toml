[project]
name = "agentic-deep-research"
version = "0.1.0"
description = "A single-file deep-research CLI for learning agent design"
requires-python = ">=3.12,<3.13"
dependencies = [
    "openai>=3.3.1,<4",
]

[dependency-groups]
dev = [
    "mypy>=1.17,<2",
    "ruff>=0.14,<1",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
