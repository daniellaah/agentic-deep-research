[project]
name = "agentic-deep-research"
version = "0.1.0"
description = "A product-grade deep research agent built step by step in Python"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "ipykernel>=6.29,<7",
    "jupyterlab>=4.4,<5",
    "openai>=1.0,<3",
    "pydantic>=2,<3",
    "python-dotenv>=1.1,<2",
    "requests>=2.32,<3",
    "tavily-python>=0.7.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "ruff>=0.12,<1",
]

[tool.uv]
package = true

[tool.ruff]
line-length = 100
target-version = "py312"
